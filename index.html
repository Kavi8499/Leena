<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Little Surprise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Caveat:wght@600;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#120B26; --bg2:#1F1445; --bg3:#2A1B57;
    --accent:#F0B94E; --accent2:#FF6F91; --accent3:#8C7BFF;
    --paper:#FBF3E6; --ink:#1F1435; --cream:#FBF3E6;
  }
  body[data-theme="sunset"]{ --bg:#341022; --bg2:#4E1730; --bg3:#6B1F3E; --accent:#FFB86B; --accent2:#FF6F91; --accent3:#FF9F5B; }
  body[data-theme="bubblegum"]{ --bg:#170D33; --bg2:#251349; --bg3:#341864; --accent:#FF6FA5; --accent2:#8C7BFF; --accent3:#6FE7C9; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; min-height:100dvh;
    background:
      radial-gradient(50% 40% at 12% -5%, color-mix(in srgb, var(--accent2) 26%, transparent), transparent 60%),
      radial-gradient(55% 45% at 105% 100%, color-mix(in srgb, var(--accent) 20%, transparent), transparent 60%),
      radial-gradient(40% 30% at 90% 8%, color-mix(in srgb, var(--accent3) 18%, transparent), transparent 55%),
      linear-gradient(180deg, var(--bg), var(--bg2) 55%, var(--bg3));
    color:var(--cream); font-family:'Space Grotesk', sans-serif;
    overflow-x:hidden; transition:background .5s ease; position:relative;
  }
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:1; opacity:.05;
    background-image:radial-gradient(circle, #fff 1px, transparent 1px);
    background-size:3px 3px;
  }
  .stage{ min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:26px 18px 76px; position:relative; z-index:2; }
  .screen{ display:none; width:100%; max-width:400px; text-align:center; animation:rise .65s cubic-bezier(.2,.8,.2,1) both; }
  .screen.active{ display:flex; flex-direction:column; align-items:center; gap:16px; }
  @keyframes rise{ from{opacity:0; transform:translateY(22px) scale(.98);} to{opacity:1; transform:translateY(0) scale(1);} }

  .dots{ position:fixed; top:14px; left:50%; transform:translateX(-50%); display:flex; gap:6px; z-index:30;}
  .dots span{ width:6px; height:6px; border-radius:50%; background:color-mix(in srgb, var(--cream) 22%, transparent); transition:background .3s, transform .3s;}
  .dots span.on{ background:var(--accent); transform:scale(1.3);}

  .eyebrow{ font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--accent); font-weight:600; opacity:.95; }
  h1{ font-family:'Fraunces', serif; font-weight:600; font-style:italic; font-size:clamp(27px,7.2vw,40px); line-height:1.1; margin:4px 0 2px; text-shadow:0 2px 24px color-mix(in srgb, var(--accent2) 30%, transparent);}
  .sub{ font-size:14.5px; color:color-mix(in srgb, var(--cream) 72%, transparent); max-width:300px; margin:0 auto; }

  button.cta{
    font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:15px; color:var(--ink);
    background:linear-gradient(155deg, color-mix(in srgb, var(--accent) 100%, white 15%), var(--accent));
    border:none; border-radius:999px; padding:14px 30px; cursor:pointer;
    box-shadow:0 2px 0 color-mix(in srgb, var(--accent) 60%, black 20%) inset, 0 10px 26px -10px color-mix(in srgb, var(--accent) 75%, transparent);
    transition:transform .15s ease; touch-action:manipulation;
  }
  button.cta:active{ transform:scale(.96) translateY(1px); }
  button.ghost{ background:color-mix(in srgb, var(--cream) 6%, transparent); color:var(--cream); border:1px solid color-mix(in srgb, var(--cream) 24%, transparent); border-radius:999px; padding:11px 22px; font-family:inherit; font-size:13px; cursor:pointer; backdrop-filter:blur(6px);}

  /* glass card w/ tilt */
  .glass-card{
    position:relative; width:100%; background:linear-gradient(165deg, color-mix(in srgb, var(--bg3) 55%, white 6%), color-mix(in srgb, var(--bg2) 70%, black 8%));
    border:1px solid color-mix(in srgb, var(--cream) 14%, transparent); border-radius:22px;
    padding:30px 22px; backdrop-filter:blur(10px);
    box-shadow:0 2px 0 color-mix(in srgb, white 8%, transparent) inset, 0 30px 60px -24px rgba(0,0,0,.6), 0 2px 12px rgba(0,0,0,.3);
    transform-style:preserve-3d; will-change:transform;
  }
  .glass-card::after{ content:""; position:absolute; inset:0; border-radius:22px; background:linear-gradient(120deg, color-mix(in srgb, var(--accent) 12%, transparent), transparent 40%); pointer-events:none;}

  /* Medallions (Tom & Jerry) */
  .medallion{
    width:64px; height:64px; border-radius:50%; overflow:hidden; position:relative;
    border:2.5px solid color-mix(in srgb, var(--accent) 70%, white 15%);
    box-shadow:0 10px 22px -8px rgba(0,0,0,.55), 0 0 0 4px color-mix(in srgb, var(--bg2) 60%, transparent);
    animation:floaty 3.6s ease-in-out infinite;
  }
  .medallion img{ width:100%; height:100%; object-fit:cover; display:block;}
  .medallion.small{ width:44px; height:44px; }
  .medallion.large{ width:92px; height:92px; }
  .medallion.jerry{ animation-delay:.6s; }
  @keyframes floaty{ 0%,100%{transform:translateY(0) rotate(-2deg);} 50%{transform:translateY(-8px) rotate(2deg);} }
  .medallion-row{ display:flex; justify-content:center; gap:16px; margin-bottom:6px; position:relative; z-index:5;}
  .corner-peek{ position:absolute; z-index:6; }
  .corner-peek.tom{ top:-18px; left:-14px; }
  .corner-peek.jerry{ bottom:-16px; right:-14px; }

  /* Countdown */
  .envelope{ width:150px; height:106px; position:relative; cursor:pointer; margin:8px 0 2px; }
  .env-back{ position:absolute; inset:0; background:var(--paper); border-radius:8px; box-shadow:0 18px 34px -12px rgba(0,0,0,.5);}
  .env-flap{ position:absolute; top:0; left:0; width:0; height:0; border-left:75px solid transparent; border-right:75px solid transparent; border-top:53px solid color-mix(in srgb, var(--paper) 82%, var(--ink) 18%); transform-origin:top; transition:transform .5s ease; border-radius:6px 6px 0 0;}
  .envelope:hover .env-flap{ transform:rotateX(-25deg);}
  .seal{ position:absolute; top:42px; left:50%; transform:translateX(-50%); width:28px; height:28px; border-radius:50%; background:var(--accent2); display:flex; align-items:center; justify-content:center; font-size:13px; box-shadow:0 4px 10px rgba(0,0,0,.35);}
  .countdown-overlay{ position:fixed; inset:0; background:var(--bg); display:none; align-items:center; justify-content:center; z-index:80; }
  .countdown-overlay.show{ display:flex; }
  .countdown-num{ font-family:'Fraunces', serif; font-style:italic; font-size:110px; color:var(--accent); text-shadow:0 0 40px color-mix(in srgb, var(--accent) 60%, transparent);}

  /* Butterflies */
  .butterfly-field{ position:relative; width:100%; height:220px; }
  .butterfly{ position:absolute; font-size:28px; cursor:pointer; user-select:none; animation:flutterA 4s ease-in-out infinite; will-change:transform;}
  .butterfly.b1{ animation-name:flutterA; } .butterfly.b2{ animation-name:flutterB; }
  .butterfly.b3{ animation-name:flutterC; } .butterfly.b4{ animation-name:flutterD; } .butterfly.b5{ animation-name:flutterA; }
  @keyframes flutterA{ 0%,100%{transform:translate(0,0) rotate(-6deg);} 25%{transform:translate(24px,-30px) rotate(6deg);} 50%{transform:translate(-10px,-55px) rotate(-8deg);} 75%{transform:translate(-30px,-20px) rotate(4deg);} }
  @keyframes flutterB{ 0%,100%{transform:translate(0,0) rotate(4deg);} 30%{transform:translate(-26px,-24px) rotate(-6deg);} 60%{transform:translate(10px,-48px) rotate(8deg);} 85%{transform:translate(28px,-14px) rotate(-4deg);} }
  @keyframes flutterC{ 0%,100%{transform:translate(0,0) rotate(-4deg);} 40%{transform:translate(18px,-40px) rotate(8deg);} 70%{transform:translate(-22px,-18px) rotate(-6deg);} }
  @keyframes flutterD{ 0%,100%{transform:translate(0,0) rotate(6deg);} 35%{transform:translate(-20px,-36px) rotate(-8deg);} 65%{transform:translate(24px,-50px) rotate(4deg);} }
  .butterfly.caught{ animation:none !important; opacity:0; transform:scale(1.8) !important; transition:opacity .3s ease, transform .3s ease; pointer-events:none;}
  .jar-row{ display:flex; align-items:center; gap:14px; }
  .msg-bubble{ background:var(--paper); color:var(--ink); border-radius:12px; padding:10px 14px; font-family:'Caveat', cursive; font-size:19px; max-width:220px; min-height:30px; box-shadow:0 10px 24px -10px rgba(0,0,0,.4);}

  /* Balloons */
  .balloon-field{ position:relative; width:100%; height:260px; }
  .balloon{ position:absolute; bottom:-20px; width:52px; height:64px; border-radius:50% 50% 46% 46%; cursor:pointer; animation:bob 3.4s ease-in-out infinite; transform-origin:center; box-shadow:0 10px 18px -8px rgba(0,0,0,.4);}
  .balloon::after{ content:""; position:absolute; left:50%; bottom:-14px; width:2px; height:16px; background:color-mix(in srgb, var(--cream) 40%, transparent); transform:translateX(-50%);}
  .balloon.popped{ animation:none; opacity:0; transform:scale(1.6); transition:opacity .25s ease, transform .25s ease; pointer-events:none;}
  @keyframes bob{ 0%,100%{transform:translateY(0) rotate(-3deg);} 50%{transform:translateY(-22px) rotate(3deg);} }
  .progress-note{ font-size:13px; color:color-mix(in srgb, var(--cream) 68%, transparent); }

  /* Cake */
  .cake-wrap{ position:relative; width:200px; height:190px; filter:drop-shadow(0 14px 20px rgba(0,0,0,.4)); }
  .flame{ transform-origin:center bottom; animation:flicker 1s ease-in-out infinite alternate; }
  @keyframes flicker{ from{transform:scaleY(1) rotate(-2deg);} to{transform:scaleY(1.12) rotate(2deg);} }
  .flame.out{ opacity:0; transform:scaleY(0); }
  .smoke{ opacity:0; } .smoke.show{ animation:smokeUp 1.1s ease-out forwards; }
  @keyframes smokeUp{ 0%{opacity:.55; transform:translateY(0) scale(.6);} 100%{opacity:0; transform:translateY(-26px) scale(1.4);} }

  /* Propose */
  .propose-card{ position:relative; width:100%; max-width:340px; min-height:250px; }
  .ribbon{ position:absolute; top:-12px; left:50%; transform:translateX(-50%); background:var(--accent2); color:var(--ink); font-size:11px; font-weight:700; letter-spacing:.06em; padding:5px 14px; border-radius:999px; box-shadow:0 6px 14px -6px rgba(0,0,0,.5); z-index:6;}
  .propose-q{ font-family:'Fraunces', serif; font-style:italic; font-size:20px; margin:14px 0 18px; min-height:54px; display:flex; align-items:center; justify-content:center; position:relative; z-index:5;}
  .propose-btns{ position:relative; height:110px; z-index:5;}
  .yes-btn{ position:relative; z-index:2; transition:font-size .25s ease, padding .25s ease; }
  .no-btn{ position:absolute; z-index:3; top:56px; left:calc(50% + 60px); transform:translateX(-50%); background:transparent; color:var(--cream); border:1px solid color-mix(in srgb, var(--cream) 30%, transparent); border-radius:999px; padding:9px 18px; font-family:inherit; font-size:13px; cursor:pointer; transition:top .18s ease, left .18s ease; touch-action:none;}
  .taunt{ font-size:12px; min-height:16px; color:color-mix(in srgb, var(--cream) 58%, transparent); margin-top:6px; position:relative; z-index:5;}
  .yes-flash{ position:fixed; inset:0; background:radial-gradient(circle at 50% 40%, var(--accent), color-mix(in srgb, var(--accent) 60%, var(--bg))); color:var(--ink); display:none; align-items:center; justify-content:center; z-index:75; font-family:'Fraunces',serif; font-style:italic; font-size:76px;}
  .yes-flash.show{ display:flex; animation:flashPop .8s ease both;}
  @keyframes flashPop{ 0%{opacity:0; transform:scale(.7);} 30%{opacity:1; transform:scale(1.05);} 100%{opacity:1; transform:scale(1);} }

  /* Note / photo */
  .note-photo{ width:140px; height:140px; border-radius:16px; overflow:hidden; box-shadow:0 18px 36px -14px rgba(0,0,0,.55); background:linear-gradient(135deg, color-mix(in srgb, var(--accent) 30%, var(--bg2)), color-mix(in srgb, var(--accent2) 30%, var(--bg2))); display:flex; align-items:center; justify-content:center; font-size:42px; border:3px solid color-mix(in srgb, var(--cream) 16%, transparent);}
  .note-photo img{ width:100%; height:100%; object-fit:cover; }
  .letter-card{ background:linear-gradient(175deg, var(--paper), color-mix(in srgb, var(--paper) 90%, black 4%)); color:var(--ink); border-radius:16px; padding:24px 22px; width:100%; max-width:320px; box-shadow:0 26px 54px -18px rgba(0,0,0,.6); text-align:left; transform-style:preserve-3d;}
  .letter-to{ font-family:'Fraunces', serif; font-style:italic; font-size:19px; margin:0 0 8px;}
  .letter-body{ font-family:'Caveat', cursive; font-size:21px; line-height:1.4; white-space:pre-wrap; min-height:80px;}
  .letter-from{ font-family:'Fraunces', serif; font-style:italic; text-align:right; margin-top:8px; font-size:17px;}
  .cursor{ display:inline-block; width:2px; background:var(--ink); animation:blink 1s step-end infinite; margin-left:1px;}
  @keyframes blink{ 50%{opacity:0;} }

  /* Finale */
  .finale-glow{ font-family:'Fraunces', serif; font-style:italic; font-size:clamp(30px,8.4vw,50px); background:linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip:text; background-clip:text; color:transparent; filter:drop-shadow(0 0 20px color-mix(in srgb, var(--accent) 55%, transparent));}
  .finale-medallions{ display:flex; justify-content:center; gap:22px; margin-top:6px; }

  canvas#confetti{ position:fixed; inset:0; pointer-events:none; z-index:70; }

  .edit-fab{ position:fixed; bottom:18px; right:18px; z-index:50; width:44px; height:44px; border-radius:50%; border:none; background:color-mix(in srgb, var(--bg2) 75%, black 10%); color:var(--cream); font-size:18px; cursor:pointer; box-shadow:0 8px 20px rgba(0,0,0,.4); display:flex; align-items:center; justify-content:center;}
  .panel-backdrop{ position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:60; opacity:0; pointer-events:none; transition:opacity .25s ease;}
  .panel-backdrop.show{ opacity:1; pointer-events:auto;}
  .panel{ position:fixed; top:0; right:0; height:100%; width:min(360px,90vw); z-index:61; background:var(--bg2); color:var(--cream); padding:22px 20px 40px; overflow-y:auto; transform:translateX(100%); transition:transform .3s ease; font-family:'Space Grotesk', sans-serif;}
  .panel.show{ transform:translateX(0);}
  .panel h2{ font-family:'Fraunces', serif; font-style:italic; font-size:22px; margin:0 0 4px;}
  .panel h3{ font-size:12px; text-transform:uppercase; letter-spacing:.08em; opacity:.6; margin:22px 0 4px; border-top:1px solid color-mix(in srgb, var(--cream) 12%, transparent); padding-top:16px;}
  .panel .field{ margin:12px 0; }
  .panel label{ display:block; font-size:12px; letter-spacing:.06em; text-transform:uppercase; opacity:.7; margin-bottom:6px;}
  .panel input[type=text], .panel textarea, .panel input[type=number]{ width:100%; background:color-mix(in srgb, var(--bg) 70%, black 5%); color:var(--cream); border:1px solid color-mix(in srgb, var(--cream) 18%, transparent); border-radius:8px; padding:10px 12px; font-family:inherit; font-size:14px;}
  .panel textarea{ min-height:80px; resize:vertical; }
  .theme-row{ display:flex; gap:10px; }
  .theme-swatch{ width:30px; height:30px; border-radius:50%; cursor:pointer; border:2px solid transparent;}
  .theme-swatch.on{ border-color:var(--cream);}
  .row-btns{ display:flex; gap:10px; margin-top:22px;}
  .link-box{ margin-top:14px; font-size:12px; word-break:break-all; background:color-mix(in srgb, var(--bg) 70%, black 5%); padding:10px; border-radius:8px; display:none;}
  .link-box.show{ display:block;}
  .close-panel{ position:absolute; top:16px; right:16px; background:none; border:none; color:var(--cream); font-size:20px; cursor:pointer;}
  .viewer-tag{ position:fixed; bottom:14px; left:50%; transform:translateX(-50%); font-size:11px; color:color-mix(in srgb, var(--cream) 50%, transparent); z-index:5;}
  .viewer-tag a{ color:var(--accent); text-decoration:none;}
  @media (prefers-reduced-motion: reduce){ .balloon,.flame,.butterfly,.medallion{ animation:none !important; } }

  /* Sweet moments swipe cards */
  .moment-stage{ position:relative; width:230px; height:290px; margin:10px auto 6px; }
  .moment-card{
    position:absolute; inset:0; background:var(--paper); border-radius:16px; padding:14px 14px 46px;
    box-shadow:0 26px 50px -18px rgba(0,0,0,.5), 0 1px 0 rgba(255,255,255,.5) inset;
    display:flex; flex-direction:column; align-items:center; transition:transform .35s cubic-bezier(.2,.8,.2,1), opacity .35s ease;
    touch-action:pan-y;
  }
  .moment-photo{ width:100%; flex:1; border-radius:10px; overflow:hidden; background:linear-gradient(135deg, color-mix(in srgb, var(--accent) 25%, var(--paper)), color-mix(in srgb, var(--accent2) 25%, var(--paper))); display:flex; align-items:center; justify-content:center; font-size:40px; }
  .moment-photo img{ width:100%; height:100%; object-fit:cover; }
  .moment-caption{ color:var(--ink); font-family:'Fraunces',serif; font-style:italic; font-size:14px; text-align:center; margin-top:10px; padding:0 4px; }
  .moment-nav{ display:flex; align-items:center; justify-content:center; gap:16px; margin-top:14px; }
  .moment-arrow{ width:38px; height:38px; border-radius:50%; border:1px solid color-mix(in srgb, var(--cream) 25%, transparent); background:color-mix(in srgb, var(--bg2) 60%, transparent); color:var(--cream); font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .moment-count{ font-size:12px; opacity:.6; letter-spacing:.05em; }

  /* Heal my heart — lock puzzle */
  .heal-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; width:100%; max-width:300px; margin:14px auto; }
  .heal-cell{ position:relative; aspect-ratio:3/4; border-radius:12px; overflow:hidden; background:linear-gradient(150deg, color-mix(in srgb, var(--bg2) 85%, black 8%), color-mix(in srgb, var(--bg2) 70%, black 18%)); box-shadow:0 14px 24px -12px rgba(0,0,0,.5), 0 1px 0 rgba(255,255,255,.08) inset; display:flex; align-items:center; justify-content:center; transform-style:preserve-3d; transition:transform .5s cubic-bezier(.3,1,.3,1); cursor:pointer; }
  .heal-cell.unlocked{ background:transparent; }
  .heal-cell .lock-icon{ font-size:22px; opacity:.85; transition:opacity .3s ease, transform .3s ease; }
  .heal-cell.unlocked .lock-icon{ opacity:0; transform:scale(0); }
  .heal-cell img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0; transition:opacity .4s ease .1s; }
  .heal-cell.unlocked img{ opacity:1; }
  .heal-cell .heal-fallback{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:26px; opacity:0; background:linear-gradient(135deg, color-mix(in srgb, var(--accent) 30%, var(--bg2)), color-mix(in srgb, var(--accent2) 30%, var(--bg2))); transition:opacity .4s ease .1s; }
  .heal-cell.unlocked .heal-fallback{ opacity:1; }
  .heal-cell.pop{ animation:healPop .4s ease; }
  @keyframes healPop{ 0%{ transform:scale(1);} 40%{ transform:scale(1.12) rotate(-2deg);} 100%{ transform:scale(1);} }

  /* Hold to love heart */
  .hold-heart{ position:relative; width:150px; height:135px; cursor:pointer; user-select:none; touch-action:none; }
  .hold-heart svg{ filter:drop-shadow(0 12px 16px rgba(0,0,0,.3)); }
  #heartFill{ transition:none; }
  .hold-ring{ position:absolute; inset:-10px; border-radius:50%; }

  /* Rewards */
  .reward-card{
    position:relative; width:100%; max-width:300px; min-height:190px; padding:26px 22px;
    background:linear-gradient(160deg, color-mix(in srgb, var(--bg2) 90%, white 4%), color-mix(in srgb, var(--bg2) 78%, black 10%));
    border-radius:20px; border:1px solid color-mix(in srgb, var(--cream) 14%, transparent);
    box-shadow:0 26px 50px -20px rgba(0,0,0,.5), 0 1px 0 color-mix(in srgb,
